<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-color: whitesmoke;
        }
        .container{
            background-color: white;
            padding: 40px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0,0, 0.1);
            max-width: 400px;
            border-radius: 15px;
        }
        h2{
            margin-bottom: 8px;
            font-size: 28px;
            text-align: center;
        }
        p{
            font-size: 14px;
            margin-bottom: 24px;
        }
        .input-type{
            margin-bottom: 20px;
        }
        .input-type label{
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600 ;
        }
        .input-type input{
            width: 100%;
            padding: 13px;
            border: 1px solid gainsboro;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.9s ease-in;
        }
        .input-type input:focus{
            border-color: rgb(255, 0, 0);
        }
        .action{
            display: flex;
            justify-content: space-between;
            align-content: center;
            font-size: 14px;
            margin-bottom: 24px;

        }
        .forget password{
            text-decoration: none;

        }
        .login{
            width: 100%;
            padding: 12px;
            background-color: rgb(42, 120, 165);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.9s ease ease-in-out;

        } 
        .login:hover{
            background-color: blue;

        }
        .redirect{
            margin-top: 25px;
            text-align: center;
            font-size: 14px;

        }
        .redirect a {
             margin-top: 25px;
            text-align: center;
            font-size: 14px;


        }

        
        
    </style>
</head>
<body> 
    <div class="container">
      <h2>Welcome Back</h2>
      <p>PLease enter your details to sign in </p>
      <form action="  ">
    <div class="input-type">
        <label for="">Username or Email </label>
        <input type="text" placeholder="Enter your email">
    </div>

    <div class="input-type">
        <label for="">
            Password
        </label>
        <input type="password" placeholder="Enter your Password">
    </div>
    <div class="action">
        <label for="">
            <input type="checkbox"> Remember me
        </label>
        <a class="forget password ">Forget Password</a>

    </div>
         <button class="login" type="Submit">Sign In</button>


    </form>
         <p class="redirect">Do not have an account ? <a href=""> Sign Up</a></p>



</div>

    
</body>
</html>
